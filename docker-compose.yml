services:
  postgres:
    image: postgres:16-alpine
    container_name: fastify-backend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fastify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fastify}
      POSTGRES_DB: ${POSTGRES_DB:-fastify_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fastify} -d ${POSTGRES_DB:-fastify_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional pgAdmin UI – browse the DB at http://localhost:5050
  # Start with: docker compose --profile tools up -d
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fastify-backend-pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
